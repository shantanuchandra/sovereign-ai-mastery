<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc"><title id="title">An exact-action boundary before tool execution</title><desc id="desc">Four ordered gates: establish authority, bind approval, recheck current context and consume once, then execute and observe. A known physical or network conflict blocks regardless of score. Synthetic control logic does not prove actual facility or enterprise assurance.</desc><rect width="760" height="930" fill="#fffcf5"/><style>text{font-family:Arial,sans-serif;fill:#14283b}.k{font-size:17px;letter-spacing:1px;fill:#075e68;font-weight:700}.h{font-size:23px;font-weight:700}.p{font-size:18px}</style><text x="40" y="52" class="h">A proposed action needs independent authority</text><text x="40" y="84" class="p">Course framework • Module 14 • 28 November 2026</text><rect x="40" y="120" width="680" height="140" rx="10" fill="#e3f1ee" stroke="#839e9a"/><text x="64" y="152" class="k">01 / ESTABLISH AUTHORITY</text><text x="64" y="190" class="h">User + agent + tenant + scoped credential</text><text x="64" y="228" class="p">Resolve trusted identity; check audience and resource.</text><path d="M380 263 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#075e68" stroke-width="3"/><rect x="40" y="295" width="680" height="140" rx="10" fill="#edf1f4" stroke="#839e9a"/><text x="64" y="327" class="k">02 / BIND THE REVIEW</text><text x="64" y="365" class="h">Exact action + version + policy + expiry</text><text x="64" y="403" class="p">Eligible reviewer; no model-issued permission.</text><path d="M380 438 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#075e68" stroke-width="3"/><rect x="40" y="470" width="680" height="140" rx="10" fill="#e3f1ee" stroke="#839e9a"/><text x="64" y="502" class="k">03 / RECHECK AND CONSUME</text><text x="64" y="540" class="h">Current context + single-use grant</text><text x="64" y="578" class="p">Deny tampering, cross-tenant access and replay.</text><path d="M380 613 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#075e68" stroke-width="3"/><rect x="40" y="645" width="680" height="140" rx="10" fill="#edf1f4" stroke="#839e9a"/><text x="64" y="677" class="k">04 / EXECUTE AND OBSERVE</text><text x="64" y="715" class="h">Intent, tool result and reconciliation</text><text x="64" y="753" class="p">Unknown outcome requires evidence before retry.</text><text x="40" y="860" class="p">Known boundary conflicts block. Missing evidence stays open.</text><text x="40" y="893" class="p">Synthetic tests are educational evidence, not production approval.</text></svg>