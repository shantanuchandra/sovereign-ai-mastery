<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 970" role="img" aria-labelledby="title desc"><title id="title">Threat model from outcome to bounded evidence</title><desc id="desc">Five numbered steps connect the protected outcome, threat path, independent controls, authorized tests and an accountable residual decision. Known physical boundary conflicts remain blocked. Changed assumptions reopen review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#075e68"/></marker></defs><rect width="960" height="970" fill="#f2f5f8"/><text x="48" y="58" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#14283f">Module 15: threat paths and evidence</text><text x="48" y="92" font-family="Arial,sans-serif" font-size="18" fill="#475569">Course-authored model. Synthetic controls do not establish deployment assurance.</text><rect x="70" y="130" width="820" height="110" rx="12" fill="white" stroke="#075e68" stroke-width="2"/><text x="100" y="169" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#14283f">1. Scope the protected outcome</text><text x="100" y="206" font-family="Arial,sans-serif" font-size="19" fill="#475569">Assets, actors, allowed actions and full lifecycle</text><path d="M480,241 V269" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="275" width="820" height="110" rx="12" fill="white" stroke="#075e68" stroke-width="2"/><text x="100" y="314" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#14283f">2. Trace a causal threat path</text><text x="100" y="351" font-family="Arial,sans-serif" font-size="19" fill="#475569">Entry point → authority crossing → consequence</text><path d="M480,386 V414" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="420" width="820" height="110" rx="12" fill="white" stroke="#075e68" stroke-width="2"/><text x="100" y="459" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#14283f">3. Enforce outside model judgment</text><text x="100" y="496" font-family="Arial,sans-serif" font-size="19" fill="#475569">Resource permissions, fixed capabilities, trusted artifacts</text><path d="M480,531 V559" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="565" width="820" height="110" rx="12" fill="white" stroke="#075e68" stroke-width="2"/><text x="100" y="604" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#14283f">4. Test the claimed boundary</text><text x="100" y="641" font-family="Arial,sans-serif" font-size="19" fill="#475569">Authorized negative cases, revision and observed failures</text><path d="M480,676 V704" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="710" width="820" height="110" rx="12" fill="white" stroke="#075e68" stroke-width="2"/><text x="100" y="749" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#14283f">5. Record the bounded decision</text><text x="100" y="786" font-family="Arial,sans-serif" font-size="19" fill="#475569">Residual risk, accountable owner and retest trigger</text><rect x="70" y="860" width="820" height="68" rx="8" fill="#fff4df" stroke="#88550a"/><text x="95" y="888" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#694208">Known off-site protected path: BLOCKED under the unchanged BANK-A rule.</text><text x="95" y="914" font-family="Arial,sans-serif" font-size="17" fill="#694208">Missing evidence stays open. Model, policy, dependency or operator changes reopen review.</text></svg>