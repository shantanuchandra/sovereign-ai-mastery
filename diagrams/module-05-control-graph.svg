<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 735" role="img" aria-labelledby="m05-title m05-desc">
<title id="m05-title">Module 05: Legal entity, law, technical control and evidence release gate</title>
<desc id="m05-desc">Course-authored decision graph, not a legal rule. First identify a legal entity and a processing activity, then candidate instruments and counsel-reviewed requirements. Trace both data derivatives and vendor support paths into an owned technical or contractual control and observed test evidence. A review gate has two explicitly named exits: candidate for release review only when every mandatory legal and physical hard gate is evidenced; otherwise HOLD or BLOCKED, with no numeric score override. The source Mermaid definition is available beside this static diagram in the reader.</desc>
<defs>
  <marker id="arrow-m05" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0E766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-hold" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="#995325" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#14283F}
    .sub{font:16px Arial,sans-serif;fill:#475569}
    .box{fill:#FFF;stroke:#9EB5BD;stroke-width:2}
    .boundary{fill:#EFF6F6;stroke:#0E766E;stroke-width:2}
    .owner{fill:#14283F;stroke:#14283F;stroke-width:2}
    .hold{fill:#FFF1E4;stroke:#995325;stroke-width:2}
    .node{font:700 20px Arial,sans-serif;fill:#14283F}
    .small{font:15px Arial,sans-serif;fill:#475569}
    .white{font:700 20px Arial,sans-serif;fill:#FFF}
    .white-small{font:15px Arial,sans-serif;fill:#DBEBF0}
    .step{font:700 13px Arial,sans-serif;fill:#0E766E;letter-spacing:1.1px}
    .edge{stroke:#0E766E;stroke-width:3;fill:none;marker-end:url(#arrow-m05)}
    .edge-hold{stroke:#995325;stroke-width:3;fill:none;marker-end:url(#arrow-hold)}
    .edge-label{font:700 14px Arial,sans-serif;fill:#475569}
  </style>
</defs>
<rect width="1600" height="735" rx="22" fill="#F2F5F8"/>
<text x="40" y="47" class="title">From legal candidate to tested release decision</text>
<text x="40" y="76" class="sub">Educational ontology, not statutory automation. Each relationship requires an owner, current source and bounded evidence.</text>
<text x="42" y="120" class="step">1 / IDENTIFY</text>
<text x="695" y="120" class="step">2 / REVIEW AND TRANSLATE</text>
<text x="42" y="340" class="step">3 / INSPECT ALL PATHS</text>
<text x="1035" y="340" class="step">4 / TEST AND DECIDE</text>

<rect x="40" y="138" width="256" height="112" rx="12" class="box"/>
<text x="58" y="171" class="node">Legal entity + role</text>
<text x="58" y="198" class="small">Who contracts and decides?</text>
<text x="58" y="220" class="small">Controller/processor nexus</text>

<rect x="352" y="138" width="256" height="112" rx="12" class="box"/>
<text x="370" y="171" class="node">Processing activity</text>
<text x="370" y="198" class="small">People, data, purpose</text>
<text x="370" y="220" class="small">Locations and systems</text>

<rect x="664" y="138" width="256" height="112" rx="12" class="box"/>
<text x="682" y="171" class="node">Candidate instrument</text>
<text x="682" y="198" class="small">Official law and article</text>
<text x="682" y="220" class="small">Version, scope, exclusions</text>

<rect x="976" y="138" width="256" height="112" rx="12" class="owner"/>
<text x="994" y="171" class="white">Counsel scope review</text>
<text x="994" y="198" class="white-small">Approve applicability,</text>
<text x="994" y="220" class="white-small">or leave NEEDS_COUNSEL</text>

<rect x="1288" y="138" width="272" height="112" rx="12" class="box"/>
<text x="1306" y="171" class="node">Reviewed requirement</text>
<text x="1306" y="198" class="small">Contract and policy owner</text>
<text x="1306" y="220" class="small">Not a vendor slogan</text>

<path d="M296 194 H352" class="edge"/>
<path d="M608 194 H664" class="edge"/>
<path d="M920 194 H976" class="edge"/>
<path d="M1232 194 H1288" class="edge"/>

<rect x="40" y="362" width="280" height="120" rx="12" class="boundary"/>
<text x="58" y="397" class="node">Data + derivatives</text>
<text x="58" y="425" class="small">Prompts, logs, embeddings,</text>
<text x="58" y="448" class="small">snapshots and restores</text>

<rect x="364" y="362" width="280" height="120" rx="12" class="boundary"/>
<text x="382" y="397" class="node">Vendor / control paths</text>
<text x="382" y="425" class="small">Support, keys, licence,</text>
<text x="382" y="448" class="small">updates and telemetry</text>

<rect x="689" y="362" width="280" height="120" rx="12" class="box"/>
<text x="707" y="397" class="node">Owned controls</text>
<text x="707" y="425" class="small">Deny rules, contracts,</text>
<text x="707" y="448" class="small">keys and named-site gates</text>

<rect x="1014" y="362" width="260" height="120" rx="12" class="box"/>
<text x="1032" y="397" class="node">Observed evidence</text>
<text x="1032" y="425" class="small">Negative tests, traces,</text>
<text x="1032" y="448" class="small">version, date and witness</text>

<rect x="1319" y="362" width="241" height="120" rx="12" class="owner"/>
<text x="1337" y="397" class="white">Hard release gate</text>
<text x="1337" y="425" class="white-small">Every mandatory</text>
<text x="1337" y="448" class="white-small">condition evidenced?</text>

<path d="M1424 250 V312 H829 V362" class="edge"/>
<path d="M320 422 H364" class="edge"/>
<path d="M644 422 H689" class="edge"/>
<path d="M969 422 H1014" class="edge"/>
<path d="M1274 422 H1319" class="edge"/>
<path d="M176 250 V315 H180 V362" class="edge"/>
<path d="M480 250 V335 H504 V362" class="edge"/>
<text x="720" y="319" class="edge-label">requirements constrain controls</text>
<text x="700" y="520" class="edge-label">Data, access and legal gates must all be tested. Score alone cannot waive a veto.</text>

<rect x="824" y="564" width="355" height="110" rx="12" class="hold"/>
<text x="843" y="598" class="node">HOLD / BLOCKED</text>
<text x="843" y="626" class="small">Unknown law, forbidden route,</text>
<text x="843" y="649" class="small">or unverified physical gate</text>

<rect x="1215" y="564" width="345" height="110" rx="12" class="boundary"/>
<text x="1234" y="598" class="node">Candidate for release review</text>
<text x="1234" y="626" class="small">Subject to human approvals;</text>
<text x="1234" y="649" class="small">not automatic certification</text>

<path d="M1380 482 V530 H1000 V564" class="edge-hold"/>
<path d="M1490 482 V564" class="edge"/>
<text x="978" y="550" class="edge-label">NO / UNKNOWN</text>
<text x="1435" y="550" class="edge-label">YES</text>
<text x="40" y="714" class="sub">Named premises means all sources and derivatives stay in the named site. A physical air gap forbids every inbound/outbound network path.</text>
</svg>
