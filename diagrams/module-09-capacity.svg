<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title desc"><title id="title">Module 09 capacity decision sequence</title><desc id="desc">Start with workload and lifecycle constraints, apply physical and connectivity gates, calculate per-replica memory and load/spare requirements, test the candidate build under load and failure, then review evidence. Conflicts block, gaps remain unverified and favorable declarations require review. This is a course-authored model, not inspected infrastructure.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075e68"/></marker></defs><rect width="760" height="980" rx="20" fill="#f8f5ec"/><g font-family="system-ui,sans-serif" fill="#14283b"><text x="40" y="45" font-size="16" font-weight="700">MODULE 09 / COURSE-AUTHORED CAPACITY MODEL</text><text x="40" y="87" font-size="27" font-weight="700">Fit is a hypothesis. Test the service.</text><rect x="40" y="125" width="680" height="88" rx="10" fill="#fff" stroke="#075e68" stroke-width="2"/><text x="65" y="159" font-size="22" font-weight="650">Workload and lifecycle constraints</text><text x="65" y="190" font-size="17">Model, context, derivatives and accepted failure case</text><path d="M380 213V234" stroke="#075e68" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="241" width="680" height="88" rx="10" fill="#fff" stroke="#075e68" stroke-width="2"/><text x="65" y="275" font-size="22" font-weight="650">Physical and connectivity gates</text><text x="65" y="306" font-size="17">No prohibited preprocessing, support or overflow</text><path d="M380 329V350" stroke="#075e68" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="357" width="680" height="88" rx="10" fill="#fff" stroke="#075e68" stroke-width="2"/><text x="65" y="391" font-size="22" font-weight="650">Per-replica memory budget</text><text x="65" y="422" font-size="17">Weights + simplified KV + overhead + added margin</text><path d="M380 445V466" stroke="#075e68" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="473" width="680" height="88" rx="10" fill="#fff" stroke="#075e68" stroke-width="2"/><text x="65" y="507" font-size="22" font-weight="650">Load and spare-replica arithmetic</text><text x="65" y="538" font-size="17">Declared profile, utilization and independent placement</text><path d="M380 561V582" stroke="#075e68" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="589" width="680" height="88" rx="10" fill="#fff" stroke="#075e68" stroke-width="2"/><text x="65" y="623" font-size="22" font-weight="650">Candidate-build load and failure tests</text><text x="65" y="654" font-size="17">Errors, successful throughput, latency and recovery</text><path d="M380 677V698" stroke="#075e68" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="705" width="680" height="88" rx="10" fill="#fff" stroke="#075e68" stroke-width="2"/><text x="65" y="739" font-size="22" font-weight="650">Evidence review and bounded decision</text><text x="65" y="770" font-size="17">Known conflict → BLOCKED; gap → UNVERIFIED</text><text x="40" y="855" font-size="19" font-weight="700">Favorable supplied tests reach REVIEW_REQUIRED at most.</text><text x="40" y="895" font-size="18">The CPU probe does not measure model or GPU performance.</text><text x="40" y="930" font-size="18">A replica count does not prove independence or availability.</text><text x="40" y="963" font-size="14">Version 1 / 27 November 2026 / Editable SVG; Mermaid source in chapter.</text></g></svg>