<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">Key custody and identity decisions</title><desc id="desc">Trusted identity, current tenant, role and attributes gate metadata access. Two separate custodians authorize bound key-version changes by a key administrator. Complete boundary and audit readiness gate both. Attestation is a separate unimplemented production design, not a facility proof.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e766e"/></marker></defs><rect width="1100" height="830" fill="#f6f8fa"/><g font-family="Arial,sans-serif" fill="#14283f"><text x="45" y="48" font-size="28" font-weight="700">Custody and access require separate decisions</text><text x="45" y="80" font-size="18">Module 16 · Course-authored v1 · 28 November 2026 · Synthetic metadata lab</text><g fill="white" stroke="#14283f" stroke-width="2"><rect x="45" y="120" width="1010" height="82" rx="10"/><rect x="45" y="260" width="310" height="95" rx="10"/><rect x="395" y="260" width="310" height="95" rx="10"/><rect x="745" y="260" width="310" height="95" rx="10"/><rect x="45" y="420" width="310" height="105" rx="10"/><rect x="395" y="420" width="310" height="105" rx="10"/><rect x="745" y="420" width="310" height="105" rx="10"/><rect x="395" y="595" width="310" height="86" rx="10"/><rect x="45" y="595" width="310" height="86" rx="10" stroke-dasharray="7 4"/></g><g font-size="20" text-anchor="middle"><text x="550" y="153" font-weight="700">Complete site boundary and audit readiness</text><text x="550" y="181">Conflict = BLOCKED · missing = UNVERIFIED · favorable declarations = DECLARED_ONLY</text><text x="200" y="298">Trusted identity</text><text x="200" y="326">and current tenant</text><text x="550" y="298">Two distinct custodians</text><text x="550" y="326">current, bound approvals</text><text x="900" y="298">Key administrator</text><text x="900" y="326">exact key + revision</text><text x="200" y="461">Role + attribute policy</text><text x="200" y="491">tenant and clearance</text><text x="550" y="461">Permitted data operation</text><text x="550" y="491">lab returns metadata only</text><text x="900" y="461">Key-version metadata</text><text x="900" y="491">old reference stays old</text><text x="550" y="630">Minimal access evidence</text><text x="550" y="657">mutable process memory</text><text x="200" y="630">Attestation release policy</text><text x="200" y="657">production design only</text></g><g fill="none" stroke="#0e766e" stroke-width="3" marker-end="url(#arrow)"><path d="M200 202 V260"/><path d="M900 202 V260"/><path d="M705 308 H745"/><path d="M900 355 V420"/><path d="M200 355 V420"/><path d="M355 473 H395"/><path d="M745 473 H705"/><path d="M550 525 V595"/><path d="M355 638 H375 V500 H395" stroke-dasharray="7 4"/></g><text x="45" y="735" font-size="18" font-weight="700">Observed: policy checks and metadata version change. No encryption, key material, IdP, KMS, HSM or TEE.</text><text x="45" y="770" font-size="18">Attestation does not establish physical residency. Independent, hardware and facility assurance remain open.</text><text x="45" y="805" font-size="16">Text equivalent and primary-source ledger: Module 16 chapter. Editable SVG + Mermaid retained.</text></g></svg>
