<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc"><title id="title">Model choice through rights, bundle, task and review</title><desc id="desc">Four gates in order. A known boundary conflict blocks; missing evidence remains unverified. Eight synthetic task cases do not authorize a production deployment.</desc><rect width="760" height="930" fill="#fffcf5"/><style>text{font-family:Arial,sans-serif;fill:#14283b}.k{font-size:17px;letter-spacing:1px;fill:#075e68;font-weight:700}.h{font-size:23px;font-weight:700}.p{font-size:18px}</style><text x="40" y="52" class="h">A model file is one part of the decision</text><text x="40" y="84" class="p">Course framework • Module 11 • 27 November 2026</text><rect x="40" y="120" width="680" height="140" rx="10" fill="#e3f1ee" stroke="#839e9a"/><text x="64" y="152" class="k">01 / ADMISSIBILITY</text><text x="64" y="190" class="h">Rights, entity and intended use</text><text x="64" y="228" class="p">BANK-A placement, operators, no external fallback</text><path d="M380 263 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#075e68" stroke-width="3"/><rect x="40" y="295" width="680" height="140" rx="10" fill="#edf1f4" stroke="#839e9a"/><text x="64" y="327" class="k">02 / COMPLETE BUNDLE</text><text x="64" y="365" class="h">Weights + tokenizer + template + runtime</text><text x="64" y="403" class="p">Revision, trusted hashes, adapters and dependencies</text><path d="M380 438 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#075e68" stroke-width="3"/><rect x="40" y="470" width="680" height="140" rx="10" fill="#e3f1ee" stroke="#839e9a"/><text x="64" y="502" class="k">03 / OBSERVED TASK</text><text x="64" y="540" class="h">English and Arabic counts stay separate</text><text x="64" y="578" class="p">Eight synthetic cases; raw output and explicit limits</text><path d="M380 613 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#075e68" stroke-width="3"/><rect x="40" y="645" width="680" height="140" rx="10" fill="#edf1f4" stroke="#839e9a"/><text x="64" y="677" class="k">04 / CONDITIONAL CHOICE</text><text x="64" y="715" class="h">Quality, cost and exit after hard gates</text><text x="64" y="753" class="p">Owner, retest and unresolved evidence remain visible</text><text x="40" y="860" class="p">Known conflicts: BLOCKED. Missing evidence: UNVERIFIED.</text><text x="40" y="893" class="p">Favourable declarations: REVIEW_REQUIRED, never certification.</text></svg>