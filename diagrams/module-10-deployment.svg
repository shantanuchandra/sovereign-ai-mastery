<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1110" role="img" aria-labelledby="title desc"><title id="title">Three fictional deployment candidates and hard gates</title><desc id="desc">Local-private keeps all protected routes at BANK-A. Managed domestic and hybrid include incompatible off-site paths. A complete declaration requires review; neither scoring nor simulated recovery certifies a deployment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#14283f"/></marker></defs><rect width="760" height="1110" fill="#f8f5ec"/><style>text{fill:#14283f;font-family:Arial,sans-serif}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.node{font-size:19px;font-weight:700;text-anchor:middle}</style><text x="36" y="52" class="head">DEPLOYMENT COMPARISON / FICTIONAL BANK-A</text><text x="36" y="88" class="body">Placement, operators and recovery precede preference scores.</text><rect x="30" y="120" width="700" height="200" rx="10" fill="#e3f1ee" stroke="#56706c"/><text x="52" y="158" class="head">LOCAL-PRIVATE: REVIEW_REQUIRED</text><rect x="55" y="179" width="250" height="48" rx="5" fill="#fff" stroke="#56706c"/><rect x="445" y="179" width="255" height="48" rx="5" fill="#fff" stroke="#56706c"/><text x="180" y="210" class="node">BANK-A serving</text><text x="572" y="210" class="node">BANK-A recovery</text><path d="M310 203H435" fill="none" stroke="#14283f" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="263" class="small">All fifteen protected routes stay at BANK-A with enterprise operators.</text><text x="52" y="296" class="small">Host-loss simulation only; no real recovery or site capability proved.</text><rect x="30" y="350" width="700" height="200" rx="10" fill="#f4e6df" stroke="#56706c"/><text x="52" y="388" class="head">MANAGED DOMESTIC: BLOCKED</text><rect x="55" y="409" width="250" height="48" rx="5" fill="#fff" stroke="#56706c"/><rect x="445" y="409" width="255" height="48" rx="5" fill="#fff" stroke="#56706c"/><text x="180" y="440" class="node">Bank input</text><text x="572" y="440" class="node">DC-B service</text><path d="M310 433H435" fill="none" stroke="#14283f" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="493" class="small">Domestic placement differs from the required physical premises.</text><text x="52" y="526" class="small">Provider-remote operation also conflicts with the default operator rule.</text><rect x="30" y="580" width="700" height="200" rx="10" fill="#f4e6df" stroke="#56706c"/><text x="52" y="618" class="head">HYBRID: BLOCKED</text><rect x="55" y="639" width="250" height="48" rx="5" fill="#fff" stroke="#56706c"/><rect x="445" y="639" width="255" height="48" rx="5" fill="#fff" stroke="#56706c"/><text x="180" y="670" class="node">BANK-A serving</text><text x="572" y="670" class="node">DC-B support / DR</text><path d="M310 663H435" fill="none" stroke="#14283f" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="723" class="small">Support, telemetry, backups, failover and state cross the boundary.</text><text x="52" y="756" class="small">Local inference and a higher preference score cannot clear the gate.</text><rect x="30" y="810" width="700" height="200" rx="10" fill="#e9edf1" stroke="#56706c"/><text x="52" y="848" class="head">GATES BEFORE RANKING</text><text x="52" y="894" class="small">Known conflict → BLOCKED; incomplete evidence → UNVERIFIED</text><text x="52" y="928" class="small">Complete declarations → REVIEW_REQUIRED, never certification</text><text x="52" y="962" class="small">Site-loss recovery + single-site-only rule needs escalation.</text><text x="36" y="1085" class="small">Course-authored diagram. No cloud deployed; no real site or recovery verified.</text></svg>