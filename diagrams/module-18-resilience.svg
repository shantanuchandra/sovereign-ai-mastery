<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">Module 18 recovery and exit decision flow</title><desc id="desc">Current requirements constrain snapshot integrity and declared boundary gates. Eligible records are restored, migrated and tested. Conflicts block; missing evidence remains unverified. A dated assurance decision feeds the next requirements review. Synthetic exercise only, no physical assurance.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#14283f"/></marker></defs><rect width="1000" height="790" fill="#f2f5f8"/><rect x="35" y="45" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="84" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Current requirements, retirement and revocation</text><path d="M320 110 V142" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="145" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="184" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Snapshot identity and integrity</text><path d="M320 210 V242" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="245" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="284" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Premises, operator, air gap and media gates</text><path d="M320 310 V342" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="345" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="384" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Restore eligible records to local file</text><path d="M320 410 V442" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="445" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="484" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Migrate JSON records to SQLite</text><path d="M320 510 V542" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="545" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="584" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Test substitute and tenant separation</text><path d="M320 610 V642" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="645" width="570" height="65" rx="8" fill="white" stroke="#0e766e" stroke-width="2"/><text x="55" y="684" font-family="Arial,sans-serif" font-size="21" fill="#14283f">Dated assurance snapshot and exit decision</text><path d="M605 278 H660" stroke="#14283f" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="230" width="300" height="100" rx="8" fill="#fff" stroke="#14283f" stroke-width="2"/><text x="690" y="264" font-family="Arial,sans-serif" font-size="16" fill="#14283f"><tspan>BLOCK known conflicts</tspan><tspan x="690" dy="30">UNVERIFIED missing evidence</tspan></text><path d="M605 678 H640 V20 H320 V40" stroke="#14283f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="35" y="755" font-family="Arial,sans-serif" font-size="17" fill="#14283f">Course-authored v1, 28 November 2026. Declarations and local tests are not physical assurance.</text></svg>