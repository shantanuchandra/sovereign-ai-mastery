<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" role="img" aria-labelledby="title desc"><title id="title">Module 20 platform product and onboarding decision flow</title><desc id="desc">Requirements connect stakeholder outcomes to criteria and ordered tenant stages. Conflicts or missing evidence interrupt progression. Active fixture feeds product review, not production approval. Course-authored, 28 November 2026.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#075e68"/></marker></defs><rect width="800" height="840" fill="#f8f5ec"/><text x="40" y="32" font-family="sans-serif" font-size="21" fill="#14283b">From product promise to bounded evidence</text><path d="M210,145 V170" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M210,250 V275" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M210,355 V380" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M210,460 V485" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M210,565 V590" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M210,670 V695" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,315 H405 V525 H420" fill="none" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,525 H420" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,630 H405 V545 H420" fill="none" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,735 H420" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="40" y="65" width="340" height="80" rx="8" fill="#e3f1ee" stroke="#075e68" stroke-width="2"/><text x="56" y="96" fill="#14283b" font-family="sans-serif" font-size="19" font-weight="700">Stakeholder outcome</text><text x="56" y="123" fill="#14283b" font-family="sans-serif" font-size="16">Workload boundary</text></g><g><rect x="40" y="170" width="340"