<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Four responsibility planes, course model</title><desc id="desc">Data and compute exchange context and results. Management operators and offline media control data and compute operations. Identity and authorization gate execution. All planes remain inside the fictional site boundary; full lifecycle edges are in the lab graph.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs><rect x="10" y="10" width="780" height="540" rx="12" fill="#f2f5f8" stroke="#14283f" stroke-width="2"/><g fill="#14283f" font-family="system-ui,sans-serif" text-anchor="middle"><text x="400" y="45" font-size="24" font-weight="700">PLANT-A: declared physical boundary</text><g stroke="#0e766e" stroke-width="2" fill="#fff"><rect x="60" y="90" width="290" height="120" rx="10"/><rect x="450" y="90" width="290" height="120" rx="10"/><rect x="60" y="350" width="290" height="120" rx="10"/><rect x="450" y="350" width="290" height="120" rx="10"/></g><g font-size="23" font-weight="700"><text x="205" y="125">DATA</text><text x="595" y="125">COMPUTE</text><text x="205" y="390">MANAGEMENT</text><text x="595" y="390">CONTROL</text></g><g font-size="19"><text x="205" y="165">Corpus, index, recovery</text><text x="595" y="165">Service and model</text><text x="205" y="430">Operators, offline media</text><text x="595" y="430">Identity, authorization</text><text x="400" y="525">A diagram organizes evidence; it does not authenticate it.</text></g></g><g stroke="#475569" fill="none" stroke-width="3" marker-end="url(#a)"><path d="M350 130H450"/><path d="M450 180H350"/><path d="M205 350V210"/><path d="M300 350L520 210"/><path d="M595 350V210"/></g></svg>
