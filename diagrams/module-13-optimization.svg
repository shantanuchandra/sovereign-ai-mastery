<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
<title id="title">Optimization evidence before release</title><desc id="desc">Define failure and physical boundary. Freeze baseline and held-out cases. Change one intervention and record build, settings and raw outputs. Known conflicts block. Missing evidence stays unverified. Favourable declarations require human review. Faster timing never overrides quality or boundary gates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14283f"/></marker></defs>
<rect width="760" height="930" fill="#f2f5f8"/><g font-family="Arial,sans-serif" fill="#14283f"><text x="40" y="52" font-size="27" font-weight="700">What can this optimization evidence support?</text><text x="40" y="82" font-size="17">Module 13 · Course-authored decision flow · 28 November 2026</text>
<g stroke="#14283f" stroke-width="2" fill="#fff"><rect x="80" y="120" width="600" height="90" rx="10"/><rect x="80" y="250" width="600" height="90" rx="10"/><rect x="80" y="380" width="600" height="110" rx="10"/><rect x="80" y="530" width="600" height="100" rx="10"/></g>
<g text-anchor="middle" font-size="21"><text x="380" y="155" font-weight="700">Define the failure and hard boundary</text><text x="380" y="184" font-size="18">Site, data, operators, training and evaluation paths</text><text x="380" y="285" font-weight="700">Freeze baseline and held-out cases</text><text x="380" y="314" font-size="18">Compatible model bundle and separate language slices</text><text x="380" y="416" font-weight="700">Choose and measure one intervention</text><text x="380" y="446" font-size="18">Prompt · RAG · adaptation · serving profile</text><text x="380" y="473" font-size="18">Retain build, settings, raw outputs and timing scope</text><text x="380" y="566" font-weight="700">Apply admissibility and task gates</text><text x="380" y="598" font-size="18">Rights · boundary · critical slices · tested rollback</text></g>
<g stroke="#14283f" stroke-width="2" marker-end="url(#arrow)" fill="none"><path d="M380 210V246"/><path d="M380 340V376"/><path d="M380 490V526"/><path d="M380 630V670H145V696"/><path d="M380 670V696"/><path d="M380 670H615V696"/></g>
<g stroke="#14283f" stroke-width="2"><rect x="35" y="700" width="220" height="110" rx="10" fill="#f9e6df"/><rect x="270" y="700" width="220" height="110" rx="10" fill="#faefd7"/><rect x="505" y="700" width="220" height="110" rx="10" fill="#dfeee9"/></g>
<g text-anchor="middle" font-size="18"><text x="145" y="734" font-weight="700">KNOWN CONFLICT</text><text x="145" y="765">Block and investigate</text><text x="145" y="790">Preserve the rule</text><text x="380" y="734" font-weight="700">MISSING EVIDENCE</text><text x="380" y="765">Keep unverified</text><text x="380" y="790">Assign owner / retest</text><text x="615" y="734" font-weight="700">FAVOURABLE</text><text x="615" y="765">Human review</text><text x="615" y="790">No certification</text></g>
<text x="40" y="860" font-size="19" font-weight="700">A faster failed answer remains a failed answer.</text><text x="40" y="889" font-size="16">Measured local timing is not production p95, energy, memory or rights approval.</text></g></svg>
