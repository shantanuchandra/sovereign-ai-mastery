<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title id="title">Data lineage and retirement, Module 08</title><desc id="desc">Source documents create chunks and lexical vectors, which feed tenant-scoped retrieval. Sources also enter registered snapshots. A separate protected retirement ledger governs live deletion and retrieval. Restoring snapshots must reapply that ledger. Course-authored synthetic model, not inspected infrastructure.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#075e68"/></marker></defs><rect width="760" height="800" rx="20" fill="#f8f5ec"/><g fill="#14283b" font-family="system-ui,sans-serif"><text x="40" y="50" font-size="16" font-weight="700">MODULE 08 / COURSE-AUTHORED LINEAGE</text><text x="40" y="93" font-size="27" font-weight="700">Retirement must survive recovery.</text><g fill="#fff" stroke="#075e68" stroke-width="2"><rect x="60" y="150" width="300" height="90" rx="10"/><rect x="60" y="300" width="300" height="90" rx="10"/><rect x="60" y="450" width="300" height="90" rx="10"/><rect x="440" y="150" width="260" height="100" rx="10"/><rect x="440" y="410" width="260" height="130" rx="10"/></g><g font-size="21" text-anchor="middle"><text x="210" y="200">Source documents</text><text x="210" y="338">Chunks and</text><text x="210" y="367">lexical vectors</text><text x="210" y="488">Tenant-scoped</text><text x="210" y="517">retrieval</text><text x="570" y="192">Registered</text><text x="570" y="221">snapshot</text><text x="570" y="454">Protected</text><text x="570" y="483">retirement ledger</text><text x="570" y="512" font-size="17">Separate from snapshot</text></g><g fill="none" stroke="#075e68" stroke-width="3" marker-end="url(#arrow)"><path d="M210 240V293"/><path d="M210 390V443"/><path d="M360 180H433"/><path d="M440 220H368"/><path d="M570 410V285H330V247"/><path d="M440 490H368"/></g><g font-size="16"><text x="395" y="140">copy</text><text x="385" y="260">restore + reapply</text><text x="400" y="315">retirement rules</text><text x="40" y="610">Eligibility precedes ranking. Retired records stay excluded.</text><text x="40" y="647">The snapshot contains earlier data; the ledger survives separately.</text><text x="40" y="705" font-weight="700">Tests demonstrate logical controls with synthetic records.</text><text x="40" y="740">No physical-location, secure-erasure or authentication assurance.</text><text x="40" y="775" font-size="14">Version 1 / 27 November 2026 / Editable SVG; Mermaid source in chapter.</text></g></g></svg>