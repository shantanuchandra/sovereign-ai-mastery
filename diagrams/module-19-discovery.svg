<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title desc"><title id="title">Evidence before discovery ranking</title><desc id="desc">Buyer evidence supports a job hypothesis. A known contradiction or boundary conflict blocks scoring. Missing required evidence stays unknown. Only complete eligible synthetic declarations receive desirability scores, operating segments and a separate sovereignty necessity field.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#14283f"/></marker></defs><rect width="900" height="780" fill="#fffcf5"/><g font-family="system-ui,sans-serif" font-size="19" fill="#14283f" text-anchor="middle"><text x="450" y="36" font-size="25" font-weight="700">Evidence before opportunity ranking</text><g stroke="#14283f" stroke-width="2" fill="#e6f1ee"><rect x="160" y="64" width="580" height="72" rx="8"/><rect x="160" y="170" width="580" height="72" rx="8"/><rect x="160" y="276" width="580" height="72" rx="8"/><rect x="160" y="382" width="580" height="72" rx="8"/><rect x="160" y="488" width="580" height="72" rx="8"/><rect x="160" y="594" width="580" height="72" rx="8"/><rect x="160" y="700" width="580" height="56" rx="8"/></g><text x="450" y="94">Buyer evidence: source, owner, date, limits</text><text x="450" y="120">Synthetic declarations, no actual customer claim</text><text x="450" y="200">Opportunity: user job, outcome, alternative</text><text x="450" y="226">Required controls and falsification test</text><text x="450" y="306">Known conflict? BLOCKED, no score</text><text x="450" y="332">Inspect every route, operator and connectivity</text><text x="450" y="412">Missing evidence? UNKNOWN, no score</text><text x="450" y="438">Return to research with an owner</text><text x="450" y="518">Complete declarations: eligible for discovery</text><text x="450" y="544">No facility, legal or market assurance</text><text x="450" y="624">Desirability score and operating segment</text><text x="450" y="650">Rank only hypotheses that passed the gates</text><text x="450" y="734">Separate necessity; choose next experiment</text></g><g stroke="#14283f" stroke-width="2" marker-end="url(#arrow)"><path d="M450 136V162"/><path d="M450 242V268"/><path d="M450 348V374"/><path d="M450 454V480"/><path d="M450 560V586"/><path d="M450 666V692"/></g></svg>
