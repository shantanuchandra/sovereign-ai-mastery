<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Versioned release and operating evidence</title><desc id="desc">A complete bundle passes gates and boundary checks before activation. Tenant indicators trigger incident review and rechecked rollback. Conflicts block and missing evidence stays unverified. All lab infrastructure is synthetic.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#075e68"/></marker><style>text{font-family:system-ui,sans-serif;fill:#14283b}.label{font-size:22px;font-weight:700}.small{font-size:18px}.box{fill:#e3f1ee;stroke:#075e68;stroke-width:2}.line{stroke:#075e68;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1000" height="780" fill="#f8f5ec"/><text x="40" y="46" font-size="28" font-weight="700">What evidence keeps a release eligible?</text><text x="40" y="80" class="small">Module 17 · Course-authored operating model · 28 November 2026</text><rect class="box" x="40" y="115" width="600" height="100" rx="8"/><text x="65" y="150" class="label">Identify the complete bundle</text><text x="65" y="184" class="small">Model · prompt · retrieval · policy · telemetry</text><path class="line" d="M340 215V245"/><rect class="box" x="40" y="250" width="600" height="100" rx="8"/><text x="65" y="285" class="label">Evaluate gates and operating boundary</text><text x="65" y="320" class="small">Quality · security · identity · recovery · artifact paths</text><path class="line" d="M640 300H690"/><rect x="700" y="250" width="260" height="160" rx="8" fill="#fff1d8" stroke="#83501a" stroke-width="2"/><text x="720" y="286" class="label">Stop at conflict</text><text x="720" y="320" class="small">BLOCKED ≠ unknown</text><text x="720" y="350" class="small">Missing evidence:</text><text x="720" y="380" class="small">UNVERIFIED</text><path class="line" d="M340 350V380"/><rect class="box" x="40" y="390" width="600" height="100" rx="8"/><text x="65" y="427" class="label">Approve exact reference, then activate</text><text x="65" y="462" class="small">Registration alone does not authorize serving</text><path class="line" d="M340 490V520"/><rect class="box" x="40" y="530" width="600" height="100" rx="8"/><text x="65" y="566" class="label">Measure tenant population and investigate</text><text x="65" y="600" class="small">Minimized telemetry · SLI denominator · error budget</text><path class="line" d="M640 580H690"/><rect class="box" x="700" y="480" width="260" height="180" rx="8"/><text x="720" y="516" class="label">Recheck rollback</text><text x="720" y="550" class="small">Current authorization</text><text x="720" y="580" class="small">Compatible state</text><text x="720" y="610" class="small">Eligible previous bundle</text><path class="line" d="M830 480V440H640"/><text x="40" y="690" class="small">Lab: 9 / 10 good admitted requests, target 95%; freeze and review.</text><text x="40" y="724" class="small">DECLARED_ONLY is not physical evidence. Pointer rollback is not data restoration.</text><text x="40" y="756" class="small">Editable SVG + Mermaid. No actual service, identity provider or production SLO is tested.</text></svg>
