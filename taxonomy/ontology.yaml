constraints:
  - A deployment label or preference score cannot clear a known placement or connectivity conflict.
  - Simulated recovery time and point do not establish achieved production recovery objectives.
  - Resource allocation does not grant data access or establish physical placement.
  - Successful-only latency must be considered alongside the error denominator.
  - A replica count does not establish independent recovery or availability.
  - Derivatives preserve source handling rules unless an authorized change is evidenced.
  - A caller-supplied tenant is not authenticated identity or authorization.
  - Restoring an old snapshot must preserve current retirement decisions.
  - Known-copy logical deletion does not establish unknown-copy or physical erasure.
  - Network permission does not relax a physical-premises requirement.
  - A sovereignty claim must name a scope, dimension, owner, and test criterion.
  - Missing evidence is unknown, not compliant or noncompliant by default.
  - Evidence must have a time, source, and relation to a specific test.
  - A vendor assertion alone cannot establish technical enforcement.
  - No automatic legal applicability inference from server location.
  - No universal numerical sovereignty certification by this course.
  - Do not store secret values in public annotations or exercises.
illustrative_claim:
  id: claim-uae-inference-001
  scope: workload
  dimension: territorial
  statement: Production inference and its request logs remain in approved UAE locations.
  owner: Enterprise platform lead
  control: egress-deny-and-region-policy
  test: inspect-execution-location-and-egress-logs
  evidence: required-not-yet-provided
  status: proposed
