constraints:
  - Retrieved instructions do not grant tool authority or permission to export data.
  - A checksum requires a trusted reference and is not a malware or provenance verdict.
  - Encryption, key ownership and attestation do not establish physical data residency.
  - Attestation requires verifier policy, freshness and workload binding; declared measurements are not verification.
  - Key administration, decryption and support access must be reviewed as separate permissions.
  - Release evidence is bound to model, prompt, policy and runtime versions; a changed build requires review.
  - Error budgets retain every eligible attempted request, including failures; successful-only latency is a separate population.
  - Telemetry is a data derivative subject to access, retention and destination controls.
  - Retrieval relevance never grants access; current permission must precede context assembly and cached reuse.
  - Citations and prompt instructions do not establish authorization or factual support.
  - Optimization observations must name the timing population and retain failures and language denominators.
  - Timing changes do not establish energy savings or preserved task quality.
  - Approval is scoped to an exact action and current authority; changed arguments invalidate reliance.
  - Expired or consumed approval cannot authorize a fresh action; ambiguous retries require reconciliation.
  - A downloaded weight file does not establish scoped permission or complete system openness.
  - Missing language denominators cannot be treated as a successful subgroup evaluation.
  - A changed tokenizer or template requires a new evaluated build identity.
  - A deployment label or preference score cannot clear a known placement or connectivity conflict.
  - Simulated recovery time and point do not establish achieved production recovery objectives.
  - Resource allocation does not grant data access or establish physical placement.
  - Successful-only latency must be considered alongside the error denominator.
  - A replica count does not establish independent recovery or availability.
  - Derivatives preserve source handling rules unless an authorized change is evidenced.
  - A caller-supplied tenant is not authenticated identity or authorization.
  - Restoring an old snapshot must preserve current retirement decisions.
  - Known-copy logical deletion does not establish unknown-copy or physical erasure.
  - Network permission does not relax a physical-premises requirement.
  - A sovereignty claim must name a scope, dimension, owner, and test criterion.
  - Missing evidence is unknown, not compliant or noncompliant by default.
  - Evidence must have a time, source, and relation to a specific test.
  - A vendor assertion alone cannot establish technical enforcement.
  - No automatic legal applicability inference from server location.
  - No universal numerical sovereignty certification by this course.
  - Do not store secret values in public annotations or exercises.
