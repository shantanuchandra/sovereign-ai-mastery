name: Verify Modules 15–17 security, custody and operations
on:
  pull_request:
    paths:
      - 'chapters/15-*'
      - 'chapters/16-*'
      - 'chapters/17-*'
      - 'labs/module-15/**'
      - 'labs/module-16/**'
      - 'labs/module-17/**'
      - 'assessments/solutions/15-*'
      - 'assessments/solutions/16-*'
      - 'assessments/solutions/17-*'
      - 'social/module-15/**'
      - 'social/module-16/**'
      - 'social/module-17/**'
      - 'diagrams/module-15*'
      - 'diagrams/module-16*'
      - 'diagrams/module-17*'
      - 'taxonomy/**'
      - 'learning/**'
      - 'qa/test_modules15_17*'
      - 'scripts/build_site.py'
      - '.github/workflows/modules15-17.yml'
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reader and browser dependencies
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'mistune>=3,<4' 'playwright>=1.55,<2' 'pypdf>=5,<7'
          python -m playwright install --with-deps chromium
      - name: Verify labs and retained observations
        run: |
          python -m unittest discover -s labs/module-15 -p 'test_*.py' -v
          python -m unittest discover -s labs/module-16 -p 'test_*.py' -v
          python -m unittest discover -s labs/module-17 -p 'test_*.py' -v
          node --test learning/tests/*.test.mjs
      - name: Record fresh bounded synthetic demonstrations
        run: |
          mkdir -p artifacts/modules15-17
          python labs/module-15/security_gate.py > artifacts/modules15-17/ci-security-run.json
          python labs/module-16/custody.py > artifacts/modules15-17/ci-custody-run.json
          python labs/module-17/release_ops.py > artifacts/modules15-17/ci-operations-run.json
      - name: Build and verify public routes and separate keys
        run: |
          python scripts/build_site.py
          python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Verify actual tutor, study progress and mobile reader
        env:
          STUDIO_QA_SCREENSHOTS: artifacts/modules15-17
        run: |
          python learning/tests/test_rendered_studio.py
          python learning/tests/test_rendered_study_plan.py
      - name: Verify three carousels and eight-page PDF exports
        run: |
          python social/module-15/test_rendered_carousel.py
          python social/module-15/export_pdf.py
          python social/module-16/test_rendered_carousel.py
          python social/module-16/export_pdf.py
          python social/module-17/test_rendered_carousel.py
          python social/module-17/export_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modules15-17-browser-evidence
          path: artifacts/modules15-17
          if-no-files-found: ignore
