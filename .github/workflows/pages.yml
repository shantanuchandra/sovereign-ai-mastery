name: Build and deploy Sovereign AI reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out book source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install static site builder dependencies
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' 'mistune>=3,<4'
      - name: Validate adaptive learning rules
        run: |
          node --test learning/tests/*.test.mjs
          node --check learning/studio-engine.mjs
          node --check learning/studio-ui.mjs
      - name: Check Python builder syntax
        run: python -m py_compile scripts/build_site.py
      - name: Validate Module 02 scoring lab
        run: |
          python -m py_compile labs/module-02/evaluate.py labs/module-02/test_evaluate.py
          python -m unittest discover -s labs/module-02 -p 'test_*.py' -v
          python labs/module-02/evaluate.py labs/module-02/cases.json > /tmp/module02-scorecard.json
          test -s /tmp/module02-scorecard.json
      - name: Validate Module 07 architecture lab
        run: python -m unittest discover -s labs/module-07 -p 'test_*.py' -v
      - name: Validate Module 06 governance lab
        run: |
          python -m unittest discover -s labs/module-06 -p 'test_*.py' -v
          python labs/module-06/evaluate.py labs/module-06/cases.json > /tmp/module06-decisions.json
      - name: Validate Module 05 legal-question evidence lab
        run: |
          python -m unittest discover -s labs/module-05 -p 'test_*.py' -v
          python labs/module-05/evaluate.py labs/module-05/cases.json > /tmp/module05-decisions.json
      - name: Validate Module 04 GCC evidence lab
        run: |
          python -m py_compile labs/module-04/evaluate.py labs/module-04/test_evaluate.py
          python -m unittest discover -s labs/module-04 -p 'test_*.py' -v
          python labs/module-04/evaluate.py labs/module-04/cases.json > /tmp/module04-decisions.json
          test -s /tmp/module04-decisions.json
      - name: Validate Module 03 requirements lab
        run: |
          python -m py_compile labs/module-03/evaluate.py labs/module-03/test_evaluate.py
          python -m unittest discover -s labs/module-03 -p 'test_*.py' -v
          python labs/module-03/evaluate.py labs/module-03/cases.json > /tmp/module03-decisions.json
          test -s /tmp/module03-decisions.json
      - name: Validate Module 03 assessment contract
        run: python -m unittest discover -s qa -p 'test_module03_assessment_contract.py' -v
      - name: Validate Module 03 social accessibility source and mutation contract
        run: python -m unittest discover -s qa -p 'test_module03_social_contract.py' -v
      - name: Validate Module 04 source inventory contract
        run: python -m unittest discover -s qa -p 'test_module04_source_ledger.py' -v
      - name: Validate Module 04 social publication contract
        run: python -m unittest discover -s qa -p 'test_module04_social_contract.py' -v
      - name: Validate Module 02 release content contract
        run: python -m unittest discover -s qa -p 'test_module02_release_contract.py' -v
      - name: Validate Module 02 carousel static print and accessibility contract
        run: python -m unittest discover -s social/module-02 -p 'test_carousel.py' -v
      - name: Install local browser QA dependencies
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.55,<2' 'pypdf>=5,<7'
          python -m playwright install --with-deps chromium
      - name: Verify actual Module 02 PDF export and responsive clipping
        run: python social/module-02/test_rendered_carousel.py
      - name: Verify actual Module 03 carousel reflow and PDF text
        run: python social/module-03/test_rendered_carousel.py
      - name: Verify actual Module 04 carousel reflow and PDF text
        run: python social/module-04/test_rendered_carousel.py
      - name: Build from Markdown source
        run: python scripts/build_site.py
      - name: Verify rendered architecture and adaptive tutor
        run: python learning/tests/test_rendered_studio.py
      - name: Verify hourly study plan and Module 05 output contract
        run: |
          python -m unittest discover -s qa -p 'test_module05_learning_contract.py' -v
          python learning/tests/test_rendered_study_plan.py
          python social/module-05/test_rendered_carousel.py
          python social/module-05/export_pdf.py
          test -s dist/social/module-05/QUESTIONS.pdf
      - name: Verify Module 07 reader and portrait PDF
        run: |
          python -m unittest discover -s qa -p 'test_module07_learning_contract.py' -v
          python social/module-07/test_rendered_carousel.py
          python social/module-07/export_pdf.py
      - name: Verify Module 06 reader and portrait PDF
        run: |
          python -m unittest discover -s qa -p 'test_module06_learning_contract.py' -v
          python social/module-06/test_rendered_carousel.py
          python social/module-06/export_pdf.py
          test -s dist/social/module-06/QUESTIONS.pdf
      - name: Publish Module 02 portrait PDF
        run: |
          python social/module-02/export_pdf.py
          test -s dist/social/module-02/QUESTIONS.pdf
      - name: Publish Module 03 portrait PDF
        run: |
          python social/module-03/export_pdf.py
          test -s dist/social/module-03/QUESTIONS.pdf
          test -s dist/social/module-04/CAROUSEL.html
          test -s dist/social/module-04/POST.html
          grep -q 'module-04/CAROUSEL.html' dist/modules/04-uae-gcc-global-sovereign-ai-ecosystems.html
          grep -q 'module-04/POST.html' dist/modules/04-uae-gcc-global-sovereign-ai-ecosystems.html
          if grep -R -l 'Facilitator solutions and marking rubric' dist/social/module-04; then
            echo '::error::Module 04 facilitator solutions leaked into public social assets'
            exit 1
          fi
      - name: Publish Module 04 portrait PDF
        run: |
          python social/module-04/export_pdf.py
          test -s dist/social/module-04/QUESTIONS.pdf
      - name: Verify rendered diagrams and onboarding
        run: |
          test -s dist/index.html
          test -s dist/onboarding/index.html
          test -s dist/learning/index.html
          test -s dist/learning/studio-engine.mjs
          test -s dist/learning/studio-ui.mjs
          test -s dist/modules/01-sovereign-ai-fundamentals.html
          test -s dist/modules/02-classifications-components-maturity-models.html
          test -s dist/modules/03-enterprise-sovereignty-requirements-strategy.html
          test -s dist/modules/04-uae-gcc-global-sovereign-ai-ecosystems.html
          grep -q 'India, EU, US, and China: comparative approaches' dist/modules/04-uae-gcc-global-sovereign-ai-ecosystems.html
          grep -q 'Other GCC opportunities and regional comparisons' dist/modules/04-uae-gcc-global-sovereign-ai-ecosystems.html
          grep -q 'What enterprise problems justify sovereignty investments' dist/modules/03-enterprise-sovereignty-requirements-strategy.html
          test -s dist/labs/module-02/index.html
          test -s dist/labs/module-03/index.html
          test -s dist/labs/module-04/index.html
          grep -q 'dated ecosystem evidence' dist/labs/module-04/index.html
          grep -q 'turn an enterprise request into an acceptance decision' dist/labs/module-03/index.html
          test -s dist/social/module-02/CAROUSEL.html
          grep -q 'href="QUESTIONS.pdf"' dist/social/module-02/CAROUSEL.html
          test -s dist/social/module-02/QUESTIONS.pdf
          test -s dist/social/module-02/POST.html
          test -s dist/social/module-03/CAROUSEL.html
          test -s dist/social/module-03/POST.html
          test -s dist/social/module-03/QUESTIONS.pdf
          grep -q 'href="QUESTIONS.pdf"' dist/social/module-03/CAROUSEL.html
          grep -q 'modules/03-enterprise-sovereignty-requirements-strategy.html' dist/social/module-03/CAROUSEL.html
          grep -q 'module-03/CAROUSEL.html' dist/modules/03-enterprise-sovereignty-requirements-strategy.html
          grep -q 'module-03/POST.html' dist/modules/03-enterprise-sovereignty-requirements-strategy.html
          if grep -R -l 'Facilitator solutions and marking rubric' dist/social/module-03 dist/modules/03-enterprise-sovereignty-requirements-strategy.html; then
            echo "::error::Module 03 facilitator solutions leaked into learner site"
            exit 1
          fi
          grep -q 'module-02/CAROUSEL.html' dist/modules/02-classifications-components-maturity-models.html
          grep -q 'module-02/POST.html' dist/modules/02-classifications-components-maturity-models.html
          grep -q 'The eight-slide carousel explains' dist/social/module-02/POST.html
          grep -q 'Microsoft Learn, Deployment types for Microsoft Foundry Models' dist/social/module-02/CAROUSEL.html
          if grep -R -l 'Facilitator solutions and marking rubric' dist/modules dist/social/module-02; then
            echo "::error::Facilitator solutions leaked into learner site"
            exit 1
          fi
          grep -q 'score claims, not marketing labels' dist/labs/module-02/index.html
          grep -q 'Sovereignty by scope' dist/modules/02-classifications-components-maturity-models.html
          grep -q '02-classifications-components-maturity-models.html' dist/index.html
          test -s dist/diagrams/module-01-claim-chain.svg
          test -s dist/diagrams/sovereignty-ontology.svg
          grep -q 'diagram-rendered' dist/modules/01-sovereign-ai-fundamentals.html
          grep -q 'diagram-rendered' dist/taxonomy/ONTOLOGY.html
          ! grep -q 'class="mermaid"' dist/modules/01-sovereign-ai-fundamentals.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Wait for Pages artifact API visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -Eq '[0-9]'; then
              echo "Pages artifact visible to Actions REST API; allowing Pages deployment metadata to converge"
              sleep 20
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt ${attempt})"
            sleep 5
          done
          echo "::error::The Pages artifact was uploaded but did not become visible to the Actions API"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
