name: Verify Module 10 deployment patterns package
on:
  pull_request:
    paths:
      - 'chapters/10-*'
      - 'assessments/solutions/10-*'
      - 'labs/module-10/**'
      - 'social/module-10/**'
      - 'diagrams/module-10*'
      - 'learning/study-plan*'
      - 'learning/tests/test_rendered_study_plan.py'
      - 'qa/test_module10*'
      - 'scripts/build_site.py'
      - 'site/assets/site.css'
      - 'TOC.md'
      - '.github/workflows/module10.yml'
permissions:
  contents: read
jobs:
  module10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install site and browser dependencies
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'mistune>=3,<4' 'playwright>=1.55,<2' 'pypdf>=5,<7'
          python -m playwright install --with-deps chromium
      - name: Verify simulated deployment and adverse declarations
        run: |
          python -m unittest discover -s labs/module-10 -p 'test_*.py' -v
          python labs/module-10/compare.py > /tmp/module10-decisions.json
      - name: Build and verify curriculum routes and assessment separation
        run: |
          python scripts/build_site.py
          python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Verify study progress and mobile reader
        env:
          STUDIO_QA_SCREENSHOTS: artifacts/module10
        run: python learning/tests/test_rendered_study_plan.py
      - name: Verify portrait slides and actual PDF
        run: |
          python social/module-10/test_rendered_carousel.py
          python social/module-10/export_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module10-browser-evidence
          path: artifacts/module10
          if-no-files-found: ignore
