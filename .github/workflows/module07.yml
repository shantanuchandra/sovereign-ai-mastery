name: Verify Module 07 architecture package
on:
  pull_request:
    paths:
      - 'chapters/07-*'
      - 'assessments/solutions/07-*'
      - 'labs/module-07/**'
      - 'social/module-07/**'
      - 'learning/study-plan*'
      - 'learning/tests/test_rendered_study_plan.py'
      - 'qa/test_module07*'
      - 'scripts/build_site.py'
      - 'site/assets/site.css'
      - 'site/assets/annotations.js'
      - 'TOC.md'
      - '.github/workflows/module07.yml'
permissions:
  contents: read
jobs:
  module07:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install site and browser dependencies
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'mistune>=3,<4' 'playwright>=1.55,<2' 'pypdf>=5,<7'
          python -m playwright install --with-deps chromium
      - name: Verify synthetic lab and invalid/adverse inputs
        run: |
          python -m unittest discover -s labs/module-07 -p 'test_*.py' -v
          python labs/module-07/validate.py labs/module-07/factory.json > /tmp/module07-decisions.json
      - name: Build and verify curriculum routes and assessment separation
        run: |
          python scripts/build_site.py
          python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Verify study progress, mobile pages and downloads
        env:
          STUDIO_QA_SCREENSHOTS: artifacts/module07
        run: python learning/tests/test_rendered_study_plan.py
      - name: Verify portrait slides and PDF text
        run: |
          python social/module-07/test_rendered_carousel.py
          python social/module-07/export_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module07-browser-evidence
          path: artifacts/module07
          if-no-files-found: ignore
