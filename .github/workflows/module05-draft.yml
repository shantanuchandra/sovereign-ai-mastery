name: Validate Module 05 draft (no deployment)
on:
  push:
    branches:
      - draft/module-05-legal-controls-20261123
    paths:
      - 'chapters/05-laws-regulation-jurisdiction.md'
      - 'assessments/solutions/05-laws-regulation-jurisdiction-solutions.md'
      - 'labs/module-05/**'
      - 'qa/test_module05_draft_contract.py'
      - 'social/module-05/**'
      - '.github/workflows/module05-draft.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax and synthetic graph tests
        run: |
          python -m compileall -q labs/module-05 qa/test_module05_draft_contract.py social/module-05/export_pdf.py
          python labs/module-05/validate.py labs/module-05/control_map.json
          python -m unittest discover -s labs/module-05 -p 'test_*.py' -v
          python -m unittest discover -s qa -p 'test_module05_draft_contract.py' -v
      - name: Install PDF rendering dependencies
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.55,<2' 'pypdf>=6,<7'
          python -m playwright install --with-deps chromium
      - name: Verify rendered Module 05 carousel reflow and keyboard focus
        run: |
          python social/module-05/test_rendered_carousel.py
      - name: Render and assert eight portrait PDF pages
        run: |
          python social/module-05/export_pdf.py
      - name: Draft remains unpublished
        run: |
          echo "Validated source and PDF locally in CI only."
          echo "No Pages deployment, merge, external-source certification, or independent accessibility review."
