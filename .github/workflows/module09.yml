name: Verify Module 09 compute platform package
on:
  pull_request:
    paths:
      - 'chapters/09-*'
      - 'assessments/solutions/09-*'
      - 'labs/module-09/**'
      - 'social/module-09/**'
      - 'learning/study-plan*'
      - 'learning/tests/test_rendered_study_plan.py'
      - 'qa/test_module09*'
      - 'scripts/build_site.py'
      - 'site/assets/site.css'
      - 'site/assets/annotations.js'
      - 'TOC.md'
      - '.github/workflows/module09.yml'
permissions:
  contents: read
jobs:
  module09:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install site and browser dependencies
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'mistune>=3,<4' 'playwright>=1.55,<2' 'pypdf>=5,<7'
          python -m playwright install --with-deps chromium
      - name: Verify synthetic lab and invalid/adverse inputs
        run: |
          python -m unittest discover -s labs/module-09 -p 'test_*.py' -v
          python labs/module-09/size.py > /tmp/module09-decisions.json
          python labs/module-09/run_host.py > /tmp/module09-host.json
      - name: Verify actual Linux Docker CPU service and owned cleanup
        run: |
          mkdir -p artifacts/module09
          python labs/module-09/run_container.py > artifacts/module09/container-evidence.json
      - name: Build and verify curriculum routes and assessment separation
        run: |
          python scripts/build_site.py
          python -m unittest discover -s qa -p 'test_*.py' -v
      - name: Verify study progress, mobile pages and downloads
        env:
          STUDIO_QA_SCREENSHOTS: artifacts/module09
        run: python learning/tests/test_rendered_study_plan.py
      - name: Verify portrait slides and PDF text
        run: |
          python social/module-09/test_rendered_carousel.py
          python social/module-09/export_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module09-browser-evidence
          path: artifacts/module09
          if-no-files-found: ignore
